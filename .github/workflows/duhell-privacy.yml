name: duHell privacy check

# The fork is public: fail loudly when its own changes carry private details.
on:
  push:
    branches: [duhell]
  pull_request:
    branches: [duhell]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'duhell-dev/t3code'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git fetch --no-tags origin main
      - run: .github/scripts/duhell-privacy-check.sh origin/main
